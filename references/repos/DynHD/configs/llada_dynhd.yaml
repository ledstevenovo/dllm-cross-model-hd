model:
  model_path: "GSAI-ML/LLaDA-8B-Instruct"
  device: "cuda"

inference:
  num_steps: 64
  temperature: 0.0

data:
  datasets:
    - name: "triviaqa"
      num_samples: 2000
  trace_save_dir: "data/traces"

features:
  top_k: 5

labeling:
  method: "openai"
  kwargs:
    model: "gpt-4o-mini"
    base_url: "https://api.openai.com/v1"
    temperature: 0.0
    max_retries: 3
