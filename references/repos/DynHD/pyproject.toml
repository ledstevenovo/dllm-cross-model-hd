[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynhd"
version = "0.1.0"
description = "Hallucination detection for diffusion language models via denoising dynamics deviation learning"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Yanyu Qian"},
  {name = "Yue Tan"},
  {name = "Yixin Liu"},
  {name = "Wang Yu"},
  {name = "Shirui Pan"},
]
dependencies = [
  "torch==2.5.1",
  "transformers==4.46.2",
  "accelerate==1.2.1",
  "numpy==1.26.4",
  "scikit-learn==1.5.0",
  "PyYAML==6.0.1",
  "tqdm==4.66.1",
  "datasets==2.18.0",
]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Paper = "https://arxiv.org/abs/2603.16459"
Repository = "https://github.com/qyy11-com/DynHD"

[tool.setuptools.packages.find]
include = ["dynhd*"]
